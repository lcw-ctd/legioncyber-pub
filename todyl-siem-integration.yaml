AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Todyl SIEM Integration - Unified single-stack template (deploy once per account).
  CloudTrail (always), GuardDuty (optional), VPC Flow Logs (optional, up to 10 VPCs).
  All S3 lifecycle rules managed here — no external Terraform lifecycle config needed.

Parameters:
  # ========================================
  # CLOUDTRAIL (always on)
  # ========================================
  TrailName:
    Type: String
    Description: CloudTrail trail name (lowercase letters/numbers only)
    AllowedPattern: '^[a-z0-9]+$'
    Default: todylcloudtrail

  CloudTrailBucketName:
    Type: String
    Description: S3 bucket name for CloudTrail logs (must be globally unique — include account ID, e.g. todyl-cloudtrail-829695622445)
    AllowedPattern: '^[a-z0-9-]+$'

  CloudTrailKmsAliasName:
    Type: String
    Description: KMS key alias for CloudTrail
    AllowedPattern: '^alias/[a-z0-9-/]+$'
    Default: alias/todyl-cloudtrail-key

  CloudTrailQueueName:
    Type: String
    Description: SQS queue name for CloudTrail notifications
    AllowedPattern: '^[a-z0-9-]+$'
    Default: todylforwardqueue

  TodylUserName:
    Type: String
    Description: IAM user name for Todyl integration
    AllowedPattern: '^[a-zA-Z0-9+=,.@_-]+$'
    Default: todylforwarduser

  # ========================================
  # GUARDDUTY (optional)
  # ========================================
  EnableGuardDuty:
    Type: String
    Description: Set to true to deploy GuardDuty findings export
    AllowedValues: ['true', 'false']
    Default: 'false'

  GuardDutyBucketName:
    Type: String
    Description: S3 bucket name for GuardDuty findings (must be globally unique — include account ID, e.g. todyl-guardduty-829695622445)
    AllowedPattern: '^[a-z0-9-]+$'

  GuardDutyQueueName:
    Type: String
    Description: SQS queue name for GuardDuty notifications
    AllowedPattern: '^[a-z0-9-]+$'
    Default: todyl-guardduty-queue

  # ========================================
  # VPC FLOW LOGS (optional, up to 10 VPCs)
  # ========================================
  EnableVpcFlowLogs:
    Type: String
    Description: Set to true to deploy VPC Flow Log export
    AllowedValues: ['true', 'false']
    Default: 'false'

  VpcFlowBucketName:
    Type: String
    Description: S3 bucket name for VPC Flow logs (must be globally unique — include account ID, e.g. todyl-vpcflow-829695622445)
    AllowedPattern: '^[a-z0-9-]+$'

  VpcFlowQueueName:
    Type: String
    Description: SQS queue name for VPC Flow Log notifications
    AllowedPattern: '^[a-z0-9-]+$'
    Default: todyl-vpcflow-queue

  VpcId1:
    Type: String
    Description: First VPC ID to monitor (required if EnableVpcFlowLogs is true)
    AllowedPattern: '^(vpc-[a-z0-9]+)?$'
    Default: ''

  VpcId2:
    Type: String
    Description: Second VPC ID to monitor (optional)
    AllowedPattern: '^(vpc-[a-z0-9]+)?$'
    Default: ''

  VpcId3:
    Type: String
    Description: Third VPC ID to monitor (optional)
    AllowedPattern: '^(vpc-[a-z0-9]+)?$'
    Default: ''

  VpcId4:
    Type: String
    Description: Fourth VPC ID to monitor (optional)
    AllowedPattern: '^(vpc-[a-z0-9]+)?$'
    Default: ''

  VpcId5:
    Type: String
    Description: Fifth VPC ID to monitor (optional)
    AllowedPattern: '^(vpc-[a-z0-9]+)?$'
    Default: ''

  VpcId6:
    Type: String
    Description: Sixth VPC ID to monitor (optional)
    AllowedPattern: '^(vpc-[a-z0-9]+)?$'
    Default: ''

  VpcId7:
    Type: String
    Description: Seventh VPC ID to monitor (optional)
    AllowedPattern: '^(vpc-[a-z0-9]+)?$'
    Default: ''

  VpcId8:
    Type: String
    Description: Eighth VPC ID to monitor (optional)
    AllowedPattern: '^(vpc-[a-z0-9]+)?$'
    Default: ''

  VpcId9:
    Type: String
    Description: Ninth VPC ID to monitor (optional)
    AllowedPattern: '^(vpc-[a-z0-9]+)?$'
    Default: ''

  VpcId10:
    Type: String
    Description: Tenth VPC ID to monitor (optional)
    AllowedPattern: '^(vpc-[a-z0-9]+)?$'
    Default: ''

  FlowLogTrafficType:
    Type: String
    Description: Type of VPC traffic to log
    Default: ALL
    AllowedValues:
      - ALL
      - ACCEPT
      - REJECT

  # ========================================
  # S3 LIFECYCLE
  # ========================================
  LogRetentionDays:
    Type: Number
    Description: Days to retain logs in S3 before expiration (applies to all buckets)
    Default: 60
    MinValue: 1
    MaxValue: 365

  # ========================================
  # SQS CONFIGURATION
  # ========================================
  SqsMessageRetentionSeconds:
    Type: Number
    Description: SQS message retention period in seconds (applies to all queues)
    Default: 604800
    MinValue: 60
    MaxValue: 1209600

  SqsVisibilityTimeoutSeconds:
    Type: Number
    Description: SQS visibility timeout in seconds (applies to all queues)
    Default: 30
    MinValue: 0
    MaxValue: 43200

Conditions:
  DeployGuardDuty: !Equals [!Ref EnableGuardDuty, 'true']
  DeployVpcFlowLogs: !Equals [!Ref EnableVpcFlowLogs, 'true']
  DeployVpc1: !And
    - !Condition DeployVpcFlowLogs
    - !Not [!Equals [!Ref VpcId1, '']]
  DeployVpc2: !And
    - !Condition DeployVpcFlowLogs
    - !Not [!Equals [!Ref VpcId2, '']]
  DeployVpc3: !And
    - !Condition DeployVpcFlowLogs
    - !Not [!Equals [!Ref VpcId3, '']]
  DeployVpc4: !And
    - !Condition DeployVpcFlowLogs
    - !Not [!Equals [!Ref VpcId4, '']]
  DeployVpc5: !And
    - !Condition DeployVpcFlowLogs
    - !Not [!Equals [!Ref VpcId5, '']]
  DeployVpc6: !And
    - !Condition DeployVpcFlowLogs
    - !Not [!Equals [!Ref VpcId6, '']]
  DeployVpc7: !And
    - !Condition DeployVpcFlowLogs
    - !Not [!Equals [!Ref VpcId7, '']]
  DeployVpc8: !And
    - !Condition DeployVpcFlowLogs
    - !Not [!Equals [!Ref VpcId8, '']]
  DeployVpc9: !And
    - !Condition DeployVpcFlowLogs
    - !Not [!Equals [!Ref VpcId9, '']]
  DeployVpc10: !And
    - !Condition DeployVpcFlowLogs
    - !Not [!Equals [!Ref VpcId10, '']]

Resources:
  # ========================================
  # SHARED IAM (always created)
  # ========================================
  TodylUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Ref TodylUserName

  TodylAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref TodylUser
      Status: Active

  TodylAccessKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: todyl/access-key
      Description: Todyl integration IAM credentials (AccessKeyId + SecretAccessKey)
      SecretString: !Sub |
        {
          "AccessKeyId": "${TodylAccessKey}",
          "SecretAccessKey": "${TodylAccessKey.SecretAccessKey}"
        }

  # ========================================
  # CLOUDTRAIL (always created)
  # ========================================
  CloudTrailQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Ref CloudTrailQueueName
      MessageRetentionPeriod: !Ref SqsMessageRetentionSeconds
      VisibilityTimeout: !Ref SqsVisibilityTimeoutSeconds

  CloudTrailQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref CloudTrailQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowS3Notification
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt CloudTrailQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:s3:::${CloudTrailBucketName}'
              StringEquals:
                aws:SourceAccount: !Ref 'AWS::AccountId'

  CloudTrailKmsKey:
    Type: AWS::KMS::Key
    DependsOn: TodylUser
    Properties:
      Description: KMS key for Todyl CloudTrail
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableRootPermissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: kms:*
            Resource: '*'
          - Sid: AllowCloudTrailEncryption
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action:
              - kms:GenerateDataKey*
            Resource: '*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${TrailName}'
              StringLike:
                kms:EncryptionContext:aws:cloudtrail:arn: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/*'
          - Sid: AllowCloudTrailLogRead
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource: '*'
          - Sid: AllowTodylUserDecrypt
            Effect: Allow
            Principal:
              AWS: !GetAtt TodylUser.Arn
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource: '*'

  CloudTrailKmsAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Ref CloudTrailKmsAliasName
      TargetKeyId: !Ref CloudTrailKmsKey

  CloudTrailBucket:
    Type: AWS::S3::Bucket
    DependsOn: CloudTrailQueuePolicy
    Properties:
      BucketName: !Ref CloudTrailBucketName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt CloudTrailKmsKey.Arn
            BucketKeyEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireLogs
            Status: Enabled
            ExpirationInDays: !Ref LogRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref LogRetentionDays
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt CloudTrailQueue.Arn

  CloudTrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CloudTrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt CloudTrailBucket.Arn
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${TrailName}'
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${CloudTrailBucket.Arn}/*'
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${TrailName}'
          - Sid: DenyNonHTTPS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt CloudTrailBucket.Arn
              - !Sub '${CloudTrailBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  CloudTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn:
      - CloudTrailBucketPolicy
      - CloudTrailKmsKey
    Properties:
      TrailName: !Ref TrailName
      S3BucketName: !Ref CloudTrailBucket
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      KMSKeyId: !GetAtt CloudTrailKmsKey.Arn
      IsLogging: true
      EventSelectors:
        - IncludeManagementEvents: true
          ReadWriteType: All

  CloudTrailManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: TodylCloudTrailIngestionPolicy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TodylCloudtrailLogIngestionPolicy
            Effect: Allow
            Action:
              - s3:GetObject
              - sqs:DeleteMessage
              - sqs:GetQueueUrl
              - sqs:GetQueueAttributes
              - sqs:ChangeMessageVisibility
              - sqs:ReceiveMessage
              - kms:Decrypt
              - kms:DescribeKey
            Resource:
              - !Sub '${CloudTrailBucket.Arn}/*'
              - !GetAtt CloudTrailQueue.Arn
              - !GetAtt CloudTrailKmsKey.Arn
      Users:
        - !Ref TodylUser

  # ========================================
  # GUARDDUTY (conditional)
  # ========================================
  GuardDutyQueue:
    Type: AWS::SQS::Queue
    Condition: DeployGuardDuty
    Properties:
      QueueName: !Ref GuardDutyQueueName
      MessageRetentionPeriod: !Ref SqsMessageRetentionSeconds
      VisibilityTimeout: !Ref SqsVisibilityTimeoutSeconds

  GuardDutyQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Condition: DeployGuardDuty
    Properties:
      Queues:
        - !Ref GuardDutyQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowS3Notification
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt GuardDutyQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:s3:::${GuardDutyBucketName}'
              StringEquals:
                aws:SourceAccount: !Ref 'AWS::AccountId'

  GuardDutyKmsKey:
    Type: AWS::KMS::Key
    Condition: DeployGuardDuty
    DependsOn: TodylUser
    Properties:
      Description: KMS key for Todyl GuardDuty findings encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableRootPermissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: kms:*
            Resource: '*'
          - Sid: AllowGuardDutyUseKey
            Effect: Allow
            Principal:
              Service: guardduty.amazonaws.com
            Action:
              - kms:GenerateDataKey
              - kms:Encrypt
            Resource: '*'
          - Sid: AllowTodylUserDecrypt
            Effect: Allow
            Principal:
              AWS: !GetAtt TodylUser.Arn
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource: '*'

  GuardDutyKmsAlias:
    Type: AWS::KMS::Alias
    Condition: DeployGuardDuty
    Properties:
      AliasName: alias/todyl-guardduty-key
      TargetKeyId: !Ref GuardDutyKmsKey

  GuardDutyBucket:
    Type: AWS::S3::Bucket
    Condition: DeployGuardDuty
    DependsOn: GuardDutyQueuePolicy
    Properties:
      BucketName: !Ref GuardDutyBucketName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt GuardDutyKmsKey.Arn
            BucketKeyEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireLogs
            Status: Enabled
            ExpirationInDays: !Ref LogRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref LogRetentionDays
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt GuardDutyQueue.Arn

  GuardDutyBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: DeployGuardDuty
    Properties:
      Bucket: !Ref GuardDutyBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowGuardDutyGetBucketLocation
            Effect: Allow
            Principal:
              Service: guardduty.amazonaws.com
            Action: s3:GetBucketLocation
            Resource: !GetAtt GuardDutyBucket.Arn
          - Sid: AllowGuardDutyPutObject
            Effect: Allow
            Principal:
              Service: guardduty.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${GuardDutyBucket.Arn}/*'
          - Sid: DenyUnencryptedObjectUploads
            Effect: Deny
            Principal:
              Service: guardduty.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${GuardDutyBucket.Arn}/*'
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption: aws:kms
          - Sid: DenyIncorrectEncryptionHeader
            Effect: Deny
            Principal:
              Service: guardduty.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${GuardDutyBucket.Arn}/*'
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption-aws-kms-key-id: !GetAtt GuardDutyKmsKey.Arn
          - Sid: DenyNonHTTPS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt GuardDutyBucket.Arn
              - !Sub '${GuardDutyBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  GuardDutyManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: DeployGuardDuty
    Properties:
      ManagedPolicyName: TodylGuardDutyIngestionPolicy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TodylGuardDutyIngestionPolicy
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
              - sqs:DeleteMessage
              - sqs:GetQueueUrl
              - sqs:GetQueueAttributes
              - sqs:ChangeMessageVisibility
              - sqs:ReceiveMessage
              - kms:Decrypt
              - kms:DescribeKey
            Resource:
              - !Sub '${GuardDutyBucket.Arn}'
              - !Sub '${GuardDutyBucket.Arn}/*'
              - !GetAtt GuardDutyQueue.Arn
              - !GetAtt GuardDutyKmsKey.Arn
      Users:
        - !Ref TodylUser

  # ========================================
  # VPC FLOW LOGS — shared infrastructure
  # One S3 bucket + SQS queue + KMS key shared across all VPCs.
  # Flow logs are partitioned by VPC ID in the S3 key path.
  # ========================================
  VpcFlowQueue:
    Type: AWS::SQS::Queue
    Condition: DeployVpcFlowLogs
    Properties:
      QueueName: !Ref VpcFlowQueueName
      MessageRetentionPeriod: !Ref SqsMessageRetentionSeconds
      VisibilityTimeout: !Ref SqsVisibilityTimeoutSeconds

  VpcFlowQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Condition: DeployVpcFlowLogs
    Properties:
      Queues:
        - !Ref VpcFlowQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowS3Notification
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt VpcFlowQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:s3:::${VpcFlowBucketName}'
              StringEquals:
                aws:SourceAccount: !Ref 'AWS::AccountId'

  VpcFlowKmsKey:
    Type: AWS::KMS::Key
    Condition: DeployVpcFlowLogs
    DependsOn: TodylUser
    Properties:
      Description: KMS key for Todyl VPC Flow Logs encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableRootPermissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: kms:*
            Resource: '*'
          - Sid: AllowVpcFlowLogDelivery
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action:
              - kms:GenerateDataKey
              - kms:Encrypt
            Resource: '*'
          - Sid: AllowTodylUserDecrypt
            Effect: Allow
            Principal:
              AWS: !GetAtt TodylUser.Arn
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource: '*'

  VpcFlowKmsAlias:
    Type: AWS::KMS::Alias
    Condition: DeployVpcFlowLogs
    Properties:
      AliasName: alias/todyl-vpcflow-key
      TargetKeyId: !Ref VpcFlowKmsKey

  VpcFlowBucket:
    Type: AWS::S3::Bucket
    Condition: DeployVpcFlowLogs
    DependsOn: VpcFlowQueuePolicy
    Properties:
      BucketName: !Ref VpcFlowBucketName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt VpcFlowKmsKey.Arn
            BucketKeyEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireLogs
            Status: Enabled
            ExpirationInDays: !Ref LogRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref LogRetentionDays
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt VpcFlowQueue.Arn

  VpcFlowBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: DeployVpcFlowLogs
    Properties:
      Bucket: !Ref VpcFlowBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSLogDeliveryAclCheck
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt VpcFlowBucket.Arn
          - Sid: AWSLogDeliveryWrite
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${VpcFlowBucket.Arn}/*'
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
          - Sid: DenyNonHTTPS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt VpcFlowBucket.Arn
              - !Sub '${VpcFlowBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  VpcFlowManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: DeployVpcFlowLogs
    Properties:
      ManagedPolicyName: TodylVpcFlowIngestionPolicy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TodylVpcFlowIngestionPolicy
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
              - sqs:DeleteMessage
              - sqs:GetQueueUrl
              - sqs:GetQueueAttributes
              - sqs:ChangeMessageVisibility
              - sqs:ReceiveMessage
              - kms:Decrypt
              - kms:DescribeKey
            Resource:
              - !Sub '${VpcFlowBucket.Arn}'
              - !Sub '${VpcFlowBucket.Arn}/*'
              - !GetAtt VpcFlowQueue.Arn
              - !GetAtt VpcFlowKmsKey.Arn
      Users:
        - !Ref TodylUser

  # ========================================
  # VPC FLOW LOGS — per-VPC FlowLog resources
  # Each VPC gets its own FlowLog pointing to the shared bucket.
  # Logs are partitioned by VPC ID automatically in the S3 key path.
  # ========================================
  VpcFlowLog1:
    Type: AWS::EC2::FlowLog
    Condition: DeployVpc1
    DependsOn: VpcFlowBucketPolicy
    Properties:
      ResourceType: VPC
      ResourceId: !Ref VpcId1
      TrafficType: !Ref FlowLogTrafficType
      LogDestinationType: s3
      LogDestination: !GetAtt VpcFlowBucket.Arn
      LogFormat: '${version} ${account-id} ${interface-id} ${srcaddr} ${dstaddr} ${srcport} ${dstport} ${protocol} ${packets} ${bytes} ${start} ${end} ${action} ${log-status}'
      MaxAggregationInterval: 60
      Tags:
        - Key: Name
          Value: !Sub 'Todyl-VPC-Flow-Log-${VpcId1}'

  VpcFlowLog2:
    Type: AWS::EC2::FlowLog
    Condition: DeployVpc2
    DependsOn: VpcFlowBucketPolicy
    Properties:
      ResourceType: VPC
      ResourceId: !Ref VpcId2
      TrafficType: !Ref FlowLogTrafficType
      LogDestinationType: s3
      LogDestination: !GetAtt VpcFlowBucket.Arn
      LogFormat: '${version} ${account-id} ${interface-id} ${srcaddr} ${dstaddr} ${srcport} ${dstport} ${protocol} ${packets} ${bytes} ${start} ${end} ${action} ${log-status}'
      MaxAggregationInterval: 60
      Tags:
        - Key: Name
          Value: !Sub 'Todyl-VPC-Flow-Log-${VpcId2}'

  VpcFlowLog3:
    Type: AWS::EC2::FlowLog
    Condition: DeployVpc3
    DependsOn: VpcFlowBucketPolicy
    Properties:
      ResourceType: VPC
      ResourceId: !Ref VpcId3
      TrafficType: !Ref FlowLogTrafficType
      LogDestinationType: s3
      LogDestination: !GetAtt VpcFlowBucket.Arn
