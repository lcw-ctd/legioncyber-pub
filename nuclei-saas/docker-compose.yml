version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ZOHO_CLIENT_ID: ${ZOHO_CLIENT_ID}
      ZOHO_CLIENT_SECRET: ${ZOHO_CLIENT_SECRET}
      ZOHO_ORGANIZATION_ID: ${ZOHO_ORGANIZATION_ID}
      ZOHO_REFRESH_TOKEN: ${ZOHO_REFRESH_TOKEN}
      ZOHO_PLAN_STARTER_ID: ${ZOHO_PLAN_STARTER_ID}
      ZOHO_PLAN_PROFESSIONAL_ID: ${ZOHO_PLAN_PROFESSIONAL_ID}
      ZOHO_PLAN_ENTERPRISE_ID: ${ZOHO_PLAN_ENTERPRISE_ID}
      ZOHO_ONETIME_PRODUCT_ID: ${ZOHO_ONETIME_PRODUCT_ID}
      ZOHO_WEBHOOK_SECRET: ${ZOHO_WEBHOOK_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      API_URL: ${API_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      FROM_EMAIL: ${FROM_EMAIL}
      NUCLEI_BINARY_PATH: ${NUCLEI_BINARY_PATH}
      NUCLEI_TEMPLATES_PATH: ${NUCLEI_TEMPLATES_PATH}
      NUCLEI_CUSTOM_TEMPLATES_PATH: ${NUCLEI_CUSTOM_TEMPLATES_PATH}
      VANTA_API_KEY: ${VANTA_API_KEY}
      CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY}
      AKAMAI_CLIENT_SECRET: ${AKAMAI_CLIENT_SECRET}
      IMPERVA_API_ID: ${IMPERVA_API_ID}
      IMPERVA_API_KEY: ${IMPERVA_API_KEY}
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    networks:
      - internal

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ZOHO_CLIENT_ID: ${ZOHO_CLIENT_ID}
      ZOHO_CLIENT_SECRET: ${ZOHO_CLIENT_SECRET}
      ZOHO_ORGANIZATION_ID: ${ZOHO_ORGANIZATION_ID}
      ZOHO_REFRESH_TOKEN: ${ZOHO_REFRESH_TOKEN}
      ZOHO_PLAN_STARTER_ID: ${ZOHO_PLAN_STARTER_ID}
      ZOHO_PLAN_PROFESSIONAL_ID: ${ZOHO_PLAN_PROFESSIONAL_ID}
      ZOHO_PLAN_ENTERPRISE_ID: ${ZOHO_PLAN_ENTERPRISE_ID}
      ZOHO_ONETIME_PRODUCT_ID: ${ZOHO_ONETIME_PRODUCT_ID}
      ZOHO_WEBHOOK_SECRET: ${ZOHO_WEBHOOK_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      API_URL: ${API_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      FROM_EMAIL: ${FROM_EMAIL}
      NUCLEI_BINARY_PATH: ${NUCLEI_BINARY_PATH}
      NUCLEI_TEMPLATES_PATH: ${NUCLEI_TEMPLATES_PATH}
      NUCLEI_CUSTOM_TEMPLATES_PATH: ${NUCLEI_CUSTOM_TEMPLATES_PATH}
      VANTA_API_KEY: ${VANTA_API_KEY}
      CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY}
      AKAMAI_CLIENT_SECRET: ${AKAMAI_CLIENT_SECRET}
      IMPERVA_API_ID: ${IMPERVA_API_ID}
      IMPERVA_API_KEY: ${IMPERVA_API_KEY}
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4 -Q scans,reports,notifications
    networks:
      - internal

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      API_URL: ${API_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      FROM_EMAIL: ${FROM_EMAIL}
    command: celery -A app.workers.celery_app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    networks:
      - internal

  scanner:
    build:
      context: ./scanner
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
      NUCLEI_BINARY_PATH: ${NUCLEI_BINARY_PATH:-/usr/local/bin/nuclei}
      NUCLEI_TEMPLATES_PATH: ${NUCLEI_TEMPLATES_PATH:-/opt/nuclei-templates}
      NUCLEI_CUSTOM_TEMPLATES_PATH: ${NUCLEI_CUSTOM_TEMPLATES_PATH:-/opt/custom-templates}
    volumes:
      - nuclei-templates:/opt/nuclei-templates
      - ./scanner/templates:/opt/custom-templates
      - scan-results:/opt/scan-results
    # Scanner container runs nuclei scans dispatched via Redis queue.
    # The backend enqueues scan jobs with target URLs and scan plan parameters.
    # Scanner picks up jobs, runs nuclei with appropriate template tags,
    # writes JSONL results to shared volume, and posts completion status to Redis.
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - internal
      - external

networks:
  internal:
    driver: bridge
  external:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nuclei-templates:
    driver: local
  scan-results:
    driver: local
