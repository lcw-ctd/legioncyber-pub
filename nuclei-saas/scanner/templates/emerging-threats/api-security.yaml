id: api-security

info:
  name: Modern API Security
  author: legioncyber
  severity: high
  description: |
    Tests for modern API security issues including GraphQL introspection, unauthenticated
    REST CRUD endpoints, exposed API versioning, Swagger/OpenAPI specs, mass assignment,
    BOLA/BFLA patterns, and CORS misconfigurations.
  tags: api,graphql,rest,swagger,oauth,jwt,cors,bola
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N
    cvss-score: 8.2
    cwe-id: CWE-284
    owasp-id: A01-2021

requests:
  # -----------------------------------------------------------------------
  # GraphQL introspection enabled (unauthenticated)
  # -----------------------------------------------------------------------
  - method: POST
    path:
      - "{{BaseURL}}/graphql"
      - "{{BaseURL}}/api/graphql"
      - "{{BaseURL}}/query"
      - "{{BaseURL}}/gql"
      - "{{BaseURL}}/api/gql"
    headers:
      Content-Type: application/json
    body: |
      {"query": "{__schema{types{name}}}"}
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "__schema"
          - "__types"
          - "QueryType"
          - "MutationType"
        condition: or
        part: body

  # -----------------------------------------------------------------------
  # GraphQL introspection — full schema dump
  # -----------------------------------------------------------------------
  - method: POST
    path:
      - "{{BaseURL}}/graphql"
      - "{{BaseURL}}/api/graphql"
    headers:
      Content-Type: application/json
    body: |
      {
        "query": "query IntrospectionQuery { __schema { queryType { name } mutationType { name } types { name kind description fields { name } } } }"
      }
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "__schema"
          - "fields"
          - "queryType"
        condition: or
        part: body

  # -----------------------------------------------------------------------
  # Exposed Swagger / OpenAPI specification
  # -----------------------------------------------------------------------
  - method: GET
    path:
      - "{{BaseURL}}/swagger.json"
      - "{{BaseURL}}/swagger.yaml"
      - "{{BaseURL}}/openapi.json"
      - "{{BaseURL}}/openapi.yaml"
      - "{{BaseURL}}/api/swagger.json"
      - "{{BaseURL}}/api/openapi.json"
      - "{{BaseURL}}/api-docs"
      - "{{BaseURL}}/v1/api-docs"
      - "{{BaseURL}}/v2/api-docs"
      - "{{BaseURL}}/swagger-ui.html"
      - "{{BaseURL}}/swagger-ui/"
      - "{{BaseURL}}/redoc"
      - "{{BaseURL}}/docs"
      - "{{BaseURL}}/api/docs"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "swagger"
          - "openapi"
          - "info"
          - "paths"
          - "components"
        condition: or
        part: body
        case-insensitive: true

  # -----------------------------------------------------------------------
  # REST API CRUD without auth — list all users
  # -----------------------------------------------------------------------
  - method: GET
    path:
      - "{{BaseURL}}/api/users"
      - "{{BaseURL}}/api/v1/users"
      - "{{BaseURL}}/api/v2/users"
      - "{{BaseURL}}/api/accounts"
      - "{{BaseURL}}/api/customers"
      - "{{BaseURL}}/api/members"
      - "{{BaseURL}}/api/employees"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "email"
          - "username"
          - "password"
          - "phone"
          - "role"
        condition: or
        part: body

  # -----------------------------------------------------------------------
  # BOLA — access object belonging to another user
  # -----------------------------------------------------------------------
  - method: GET
    path:
      - "{{BaseURL}}/api/users/1"
      - "{{BaseURL}}/api/users/2"
      - "{{BaseURL}}/api/orders/1"
      - "{{BaseURL}}/api/invoices/1"
      - "{{BaseURL}}/api/payments/1"
      - "{{BaseURL}}/api/accounts/1"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "email"
          - "username"
          - "amount"
          - "total"
          - "phone"
          - "address"
        condition: or
        part: body

  # -----------------------------------------------------------------------
  # Mass assignment — extra JSON fields accepted
  # -----------------------------------------------------------------------
  - method: POST
    path:
      - "{{BaseURL}}/api/user/profile"
      - "{{BaseURL}}/api/register"
      - "{{BaseURL}}/api/users"
    headers:
      Content-Type: application/json
    body: |
      {
        "username": "testuser",
        "email": "testuser@example.com",
        "password": "Test1234!",
        "role": "admin",
        "is_admin": true,
        "org_id": 1,
        "credit": 9999
      }
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 201
      - type: word
        words:
          - "role"
          - "admin"
          - "is_admin"
          - "credit"
        condition: or
        part: body
        case-insensitive: true

  # -----------------------------------------------------------------------
  # CORS misconfiguration — arbitrary origin reflected
  # -----------------------------------------------------------------------
  - method: GET
    path:
      - "{{BaseURL}}/api/"
      - "{{BaseURL}}/api/v1/"
    headers:
      Origin: "https://evil.example.com"
    matchers-condition: and
    matchers:
      - type: word
        words:
          - "https://evil.example.com"
        part: header
      - type: word
        words:
          - "Access-Control-Allow-Origin: https://evil.example.com"
          - "Access-Control-Allow-Credentials: true"
        condition: or
        part: header

  # -----------------------------------------------------------------------
  # API versioning — older unpatched versions accessible
  # -----------------------------------------------------------------------
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/"
      - "{{BaseURL}}/api/v2/"
      - "{{BaseURL}}/api/v0/"
      - "{{BaseURL}}/api/beta/"
      - "{{BaseURL}}/api/internal/"
      - "{{BaseURL}}/api/dev/"
      - "{{BaseURL}}/api/test/"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "api"
          - "version"
          - "endpoint"
          - "route"
          - "resource"
        condition: or
        part: body
        case-insensitive: true
