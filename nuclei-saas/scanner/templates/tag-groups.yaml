# nuclei template tag groups — used by the scanner service to resolve
# scan plan names into concrete nuclei -tags values.
#
# Usage in scanner.py:
#   tags = TAG_GROUPS["owasp_top10"]
#   cmd += ["-tags", ",".join(tags)]

tag_groups:

  # OWASP Top 10 2021 — primary compliance and web application assessment
  owasp_top10:
    - owasp
    - injection
    - xss
    - sqli
    - ssrf
    - idor
    - auth
    - crypto
    - misconfig

  # Full comprehensive scan — all relevant categories, higher noise tolerance
  full_scan:
    - owasp
    - cve
    - exposure
    - misconfig
    - default-login
    - panel
    - takeover
    - tech
    - vuln
    - injection
    - xss
    - sqli
    - ssrf
    - idor
    - auth
    - crypto
    - deserialization
    - lfi
    - rfi
    - ssti
    - jwt
    - cors

  # API-focused scan — REST, GraphQL, gRPC, OAuth, JWT, CORS
  api_scan:
    - api
    - graphql
    - rest
    - swagger
    - oauth
    - jwt
    - cors
    - idor
    - ssrf
    - injection

  # PCI-DSS compliance scan — aligned to PCI DSS v4.0 requirements
  compliance_pci:
    - owasp
    - injection
    - misconfig
    - crypto
    - auth
    - exposure
    - sqli
    - xss
    - ssrf

  # Light / quick scan — low-noise informational sweep, no active probing
  light_scan:
    - misconfig
    - exposure
    - headers
    - tech
    - panel

  # SOC 2 / ISO 27001 compliance scan
  compliance_soc2:
    - owasp
    - auth
    - crypto
    - misconfig
    - exposure
    - access-control
    - logging

  # Cloud infrastructure scan — cloud metadata, S3, IAM, GCP, Azure
  cloud_scan:
    - cloud
    - aws
    - gcp
    - azure
    - s3
    - exposure
    - misconfig

  # AI / LLM security scan — emerging threat coverage
  ai_scan:
    - ai
    - llm
    - openai
    - chatbot
    - api
    - exposure
    - auth

  # Custom — tags provided directly by the user at scan creation time
  custom: []

# Tags to always exclude from blackbox scans (destructive / noisy)
default_exclude_tags:
  - dos
  - fuzz
  - intrusive
  - brute-force

# Tags to exclude from CI/CD pipeline scans (fast, non-blocking)
ci_exclude_tags:
  - dos
  - fuzz
  - intrusive
  - brute-force
  - slow
  - time-based
